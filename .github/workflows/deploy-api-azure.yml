name: Deploy API to Azure App Service

on:
  push:
    branches: [ "stable-version" ]
    paths:
      - "CapLed.API/**"
      - "CapLed.Core/**"
      - "CapLed.Infrastructure/**"
      - ".github/workflows/deploy-api-azure.yml"
  workflow_dispatch:

jobs:
  deploy-api:
    name: Deploy CapLed API
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore API
        run: dotnet restore CapLed.API/CapLed.API.csproj

      - name: Publish API
        run: dotnet publish CapLed.API/CapLed.API.csproj --configuration Release --output ./publish /p:UseAppHost=false

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: partfinder-api-eisi2026
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
